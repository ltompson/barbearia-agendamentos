<!--
  Tela de login da Alquimista Barbearia
  Acesso restrito — equipe
-->
<main class="login-container" role="main">

  <div class="login-bg"></div>

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <span>✂</span>
    </div>

    <!-- Título -->
    <div class="login-titulo">
      <div class="linha-dec"></div>
      <h1>ALQUIMISTA</h1>
      <div class="linha-dec"></div>
    </div>
    <p class="login-subtitle">Painel Administrativo</p>

    <!-- Formulário -->
    <form [formGroup]="form" (ngSubmit)="entrar()" aria-label="Formulário de login">

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Usuário</mat-label>
        <input matInput type="text" formControlName="usuario" placeholder="Ex: francisco" autocomplete="username">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" placeholder="••••••••" autocomplete="current-password">
      </mat-form-field>

      <p *ngIf="erro" class="erro-msg">{{ erro }}</p>

      <button class="btn-entrar" type="submit" [disabled]="carregando">
        {{ carregando ? 'ENTRANDO...' : 'ENTRAR' }}
      </button>

    </form>

    <!-- Rodapé -->
    <p class="login-rodape">✂ · CUIDADO · ESTILO · CONFIANÇA</p>

  </div>

</main>
